<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gabriel Viana | Certificados</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <!-- CABEÇALHO -->

        <header class="cabecalho">

            <p class="titulo-pequeno">
                MEU PERFIL PROFISSIONAL
            </p>

            <h1>Gabriel Viana</h1>

            <p class="subtitulo">
                Certificados e cursos
            </p>

            <p class="descricao">
                Alguns dos cursos e certificações que venho realizando
                para aprimorar meus conhecimentos profissionais.
            </p>

        </header>


        <!-- CERTIFICADOS -->

        <section
            class="certificados"
            id="certificados"
        >

        </section>


    </main>


    <!-- JANELA DO CERTIFICADO -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal-conteudo">

            <button
                class="fechar"
                id="fechar"
                type="button"
            >
                &times;
            </button>


            <div class="certificado-ampliado">

                <img
                    id="imagem-ampliada"
                    src=""
                    alt="Certificado ampliado"
                >

            </div>


            <a
                id="botao-pdf"
                href=""
                target="_blank"
                class="botao-pdf"
            >
                Abrir PDF original
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
